# Sources of Pantera's ad-block data, unpacked into the Chromium source tree by build.sh. Raise
# the pins with Pantera releases (DECISION-14, DECISION-15), together with the versions in
# third_party/*/README.chromium and pantera/components/adblock/resources/README.txt.

# uBlock Origin's scriptlets and redirect resources (GPL-3.0), turned into resources.json by
# scripts/build-adblock-resources.mjs.
[ublock]
version = 1.75.0
url = https://github.com/gorhill/uBlock/archive/refs/tags/%(version)s.tar.gz
download_filename = uBlock-%(version)s.tar.gz
strip_leading_dirs = uBlock-%(version)s
sha512 = fa7da0a80f9e75e44f667c1e1a07b3a7ac20ab7e3185b85fe0c80cfaba69f79488bf3b7d67245319ebf3a716533413acdd5aaeb2043de3e5ded1f53ec801bbde
output_path = third_party/ublock

# Brave's filter list catalog and its own scriptlets (MPL-2.0).
[brave-adblock-resources]
version = 6da9b247c3368baa8b4f24cd02046e18702a6527
url = https://github.com/brave/adblock-resources/archive/%(version)s.tar.gz
download_filename = adblock-resources-%(version)s.tar.gz
strip_leading_dirs = adblock-resources-%(version)s
sha512 = 29148f22018f486026a41314e6634d08eab7e3aaefca4b61988abfd6f4f60beed50ec2a37eed0f0eb9f369eff40ff473fecbe5621434ae08c5adb03840db4c49
output_path = third_party/brave_adblock_resources
